<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root {
            color-scheme: light;
            --bg: #f3f6fb;
            --surface: #ffffff;
            --border: #d9e2ec;
            --text: #243b53;
            --muted: #627d98;
            --accent: #2563eb;
            --accent-soft: #dbeafe;
            --high: #dc2626;
            --medium: #d97706;
            --low: #059669;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .app-header {
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            color: white;
            padding: 2rem 1.5rem;
        }

        .app-header h1 {
            margin: 0 0 0.35rem;
            font-size: 2rem;
        }

        .app-header p {
            margin: 0;
            color: rgba(255, 255, 255, 0.9);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-create {
            border: none;
            background: white;
            color: var(--accent);
            padding: 0.7rem 1rem;
            border-radius: 999px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-create:hover {
            background: #eff6ff;
        }

        main {
            padding: 1.5rem;
        }

        .board-shell {
            position: relative;
            min-height: 280px;
            overflow: hidden;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, minmax(220px, 1fr));
            gap: 1rem;
            align-items: start;
        }

        .error-overlay {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: min(320px, calc(100% - 2rem));
            z-index: 5;
            transform: translateX(110%);
            transition: transform 220ms ease;
            pointer-events: none;
        }

        .error-overlay.is-visible {
            transform: translateX(0);
            pointer-events: auto;
        }

        .error-overlay .state {
            margin: 0;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.16);
            text-align: left;
        }

        .column {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1rem;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.9rem;
        }

        .column-header h2 {
            margin: 0;
            font-size: 1.1rem;
        }

        .count {
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 999px;
            padding: 0.2rem 0.6rem;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .card {
            background: #fcfdff;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .state {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            text-align: center;
        }

        .state-loading {
            color: var(--accent);
        }

        .state-error {
            border-color: #fecaca;
            background: #fef2f2;
            color: var(--high);
        }

        .state-title {
            margin: 0 0 0.35rem;
            font-size: 1.1rem;
        }

        .state-message {
            margin: 0 0 0.9rem;
            color: var(--muted);
        }

        .state-actions {
            display: flex;
            justify-content: center;
        }

        .btn-retry {
            border: none;
            background: var(--high);
            color: white;
            padding: 0.6rem 0.9rem;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-retry:hover {
            background: #b91c1c;
        }

        .column-placeholder {
            margin: 0;
            padding: 0.8rem 0;
            border: 1px dashed var(--border);
            border-radius: 10px;
            background: #fbfdff;
            color: var(--muted);
            text-align: center;
            font-size: 0.93rem;
        }

        .board-notice {
            padding: 0.85rem 1rem;
            border-radius: 10px;
            border: 1px solid #fecaca;
            background: #fef2f2;
            color: var(--high);
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.14);
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            animation: boardNoticeIn 220ms ease-out forwards, boardNoticeOut 220ms ease-in 4.78s forwards;
        }

        @keyframes boardNoticeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes boardNoticeOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        /* Spans the whole grid so it never steals a column slot. */
        .board-empty {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            margin: 0;
            padding: 2.25rem 1.5rem;
            border: 1px dashed var(--border);
            border-radius: 12px;
            background: linear-gradient(180deg, var(--surface), var(--muted-surface));
            text-align: center;
        }

        .board-empty .empty-icon {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            margin-bottom: 0.35rem;
            border-radius: 12px;
            background: var(--accent-soft);
            color: var(--accent);
        }

        .board-empty .empty-icon svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .board-empty h2 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .board-empty p {
            margin: 0;
            color: var(--muted);
            font-size: 0.93rem;
        }

        .board-empty .btn-create {
            margin-top: 0.85rem;
        }

        .card.dragging {
            opacity: 0.6;
            transform: scale(0.98);
        }

        .column.drag-over {
            outline: 2px dashed var(--accent);
            outline-offset: 2px;
            background: #f8fbff;
        }

        .card-title {
            margin: 0 0 0.35rem;
            font-size: 1rem;
        }

        .card-description {
            margin: 0 0 0.75rem;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.4;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 0.8rem;
        }

        .priority {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .priority-high {
            background: #fee2e2;
            color: var(--high);
        }

        .priority-medium {
            background: #fef3c7;
            color: var(--medium);
        }

        .priority-low {
            background: #dcfce7;
            color: var(--low);
        }

        .btn-edit {
            border: none;
            background: var(--accent);
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
        }

        .btn-edit:hover {
            background: #1d4ed8;
        }

        .btn-edit .icon { width: 16px; height: 16px; display: inline-block; fill: currentColor }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0 }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 20;
        }

        .modal-backdrop.is-open {
            display: flex;
        }

        body.modal-open {
            overflow: hidden;
        }

        .modal {
            width: min(560px, 100%);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 24px 50px rgba(15, 23, 42, 0.24);
            overflow: hidden;
            transform: translateY(8px);
            opacity: 0;
            transition: transform .22s cubic-bezier(.2,.9,.2,1), opacity .18s ease;
        }

        .modal-backdrop.is-open .modal { transform: translateY(0); opacity: 1 }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.1rem 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .modal-close {
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 1.35rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .task-form {
            padding: 1.1rem 1.25rem 1.25rem;
        }

        .form-alert {
            margin-bottom: 0.9rem;
            padding: 0.75rem 0.85rem;
            border-radius: 10px;
            border: 1px solid #fecaca;
            background: #fef2f2;
            color: var(--high);
            font-size: 0.95rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-bottom: 0.9rem;
            font-weight: 600;
            color: var(--text);
        }

        .field input,
        .field textarea,
        .field select {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.7rem 0.8rem;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text);
        }

        .field textarea {
            min-height: 96px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.7rem;
            margin-top: 1rem;
        }

        .btn-secondary,
        .btn-primary {
            border: none;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--text);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        :root {
            color-scheme: light;
            --bg: #f6f8fb;
            --surface: #ffffff;
            --muted-surface: #fbfdff;
            --border: #e6eef8;
            --text: #0f1724;
            --muted: #5b6b7a;
            --accent: #6366f1;
            --accent-2: #22c55e;
            --accent-soft: #eef2ff;
            --high: #ef4444;
            --shadow: 0 8px 30px rgba(16,24,40,0.08);
            --glass: rgba(255,255,255,0.6);
        }

        * { box-sizing: border-box; }

        html,body { height: 100%; }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            background: linear-gradient(180deg, var(--bg), #ffffff 60%);
            color: var(--text);
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            line-height: 1.4;
            transition: background .2s ease;
            /* The page itself never scrolls; each column body scrolls instead. */
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-header { flex: none; width: 100%; }

        main {
            flex: 1 1 auto;
            min-height: 0; /* allows children to shrink below content height */
            display: flex;
            flex-direction: column;
            padding: 2rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .app-header {
            background: linear-gradient(90deg, rgba(99,102,241,0.95), rgba(59,130,246,0.95));
            color: white;
            padding: 2.25rem 1.5rem;
            border-radius: 12px;
            margin: 1.5rem auto 0;
            max-width: 1200px;
            box-shadow: var(--shadow);
        }

        .app-header h1 { margin: 0 0 0.25rem; font-size: 1.75rem; font-weight: 700; }
        .app-header p { margin: 0; color: rgba(255,255,255,0.9); font-weight: 500; }

        .header-content { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap }

        .btn-create {
            border: none;
            background: linear-gradient(90deg,var(--accent),#3b82f6);
            color: white;
            padding: 0.65rem 1rem;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(99,102,241,0.18);
            transition: transform .12s ease, box-shadow .12s ease;
        }

        .btn-create:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(59,130,246,0.18); }

        .board-shell {
            position: relative;
            margin-top: 1.25rem;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.25rem;
            align-items: stretch; /* columns fill the board height */
            flex: 1 1 auto;
            min-height: 0;
        }

        .column {
            background: linear-gradient(180deg,var(--surface),var(--muted-surface));
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid var(--border);
            box-shadow: 0 6px 22px rgba(15,23,42,0.04);
            /* Header stays pinned; only the body below it scrolls. */
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .column-header { flex: none; }

        .column-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
        }

        .column-body::-webkit-scrollbar { width: 8px; }
        .column-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
        .column-body::-webkit-scrollbar-thumb:hover { background: var(--muted); }

        /* entrance animations */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .column.animate-in { animation: fadeUp .32s cubic-bezier(.2,.9,.2,1) both; }
        .card.animate-in { animation: fadeUp .36s cubic-bezier(.2,.9,.2,1) both; }

        .avatar { width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:0.75rem; margin-right:0.6rem; background: linear-gradient(90deg,#7c3aed,#3b82f6); }

        .column-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem }
        .column-header h2 { margin:0; font-size:1.05rem; font-weight:600 }

        .count { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 0.25rem 0.6rem; font-size: 0.85rem; font-weight:700 }

        .card { background: white; border-radius: 12px; padding: 0.9rem; margin-bottom: 0.75rem; box-shadow: 0 6px 18px rgba(15,23,42,0.06); border: 1px solid transparent; transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease; }

        .card:hover { transform: translateY(-6px); box-shadow: 0 14px 40px rgba(16,24,40,0.10); border-color: rgba(99,102,241,0.12) }

        .card.dragging { opacity:0.7; transform: scale(.99) }

        .card-meta { display:flex; justify-content:space-between; align-items:center; font-size:0.9rem; color:var(--muted); margin-bottom:0.6rem }

        .card-description { margin:0 0 0.65rem; color:var(--muted); font-size:0.92rem }

        .priority { display:inline-block; padding:0.25rem 0.5rem; border-radius:999px; font-size:0.72rem; font-weight:700; text-transform:uppercase }
        .priority-high { background: #fff1f2; color: var(--high) }
        .priority-medium { background: #fffbeb; color: #b45309 }
        .priority-low { background: #ecfdf5; color: var(--accent-2) }

        .btn-edit { border:none; background:transparent; color:var(--accent); padding:0.45rem 0.6rem; border-radius:8px; cursor:pointer; font-weight:700 }

        .column.drag-over { outline: 2px dashed rgba(99,102,241,0.25); outline-offset:6px; background: linear-gradient(180deg,#fbfdff,#f6f8ff) }

        .state { padding:1.25rem; border-radius:12px; text-align:center; box-shadow: var(--shadow); }
        .state-loading { color: var(--accent) }
        .state-error { border-color: #fee2e2; background: #fff5f5; color: var(--high) }

        /* Lives outside .board so it can never affect the grid's track sizing. */
        .board-notice-slot:empty { display: none; }
        .board-notice-slot { margin-bottom: 1rem; }

        /* Full-width banner above the columns: wide and short, never over the cards. */
        .board-notice {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            width: 100%;
            padding: 0.65rem 0.9rem;
            border-radius: 10px;
            border: 1px solid #fee2e2;
            background: #fff5f5;
            color: var(--high);
            font-size: 0.88rem;
            line-height: 1.35;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
        }

        .board-notice::before {
            content: "!";
            flex: none;
            display: grid;
            place-items: center;
            width: 18px;
            height: 18px;
            margin-top: 0.05rem;
            border-radius: 50%;
            background: var(--high);
            color: white;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .modal-backdrop { position:fixed; inset:0; background: rgba(2,6,23,0.5); display:none; align-items:center; justify-content:center; padding:1rem; z-index:30 }
        .modal-backdrop.is-open { display:flex }
        body.modal-open { overflow:hidden }

        /* Header stays pinned; the form body scrolls when the dialog is taller than the screen. */
        .modal { width:min(620px,100%); max-height:calc(100vh - 2rem); display:flex; flex-direction:column; background: white; border-radius:14px; overflow:hidden; box-shadow: 0 30px 70px rgba(2,6,23,0.2) }
        .modal-header { flex:none; padding:1.1rem 1.25rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border) }
        .modal-header h2 { margin:0; font-size:1.15rem }
        .modal-close { border:none; background:transparent; color:var(--muted); font-size:1.35rem; cursor:pointer }

        .task-form { padding:1.1rem 1.25rem 1.25rem; flex:1 1 auto; min-height:0; overflow-y:auto; scrollbar-width:thin }
        .field { display:flex; flex-direction:column; gap:0.35rem; margin-bottom:0.85rem; font-weight:600; color:var(--text) }
        .field input, .field textarea, .field select { border:1px solid var(--border); border-radius:10px; padding:0.75rem 0.9rem; font-size:0.95rem; font-family:inherit }
        .field input:focus, .field textarea:focus, .field select:focus { outline:none; box-shadow:0 6px 20px rgba(99,102,241,0.12); border-color: rgba(99,102,241,0.18) }

        .form-alert { margin-bottom:0.9rem; padding:0.75rem 0.85rem; border-radius:10px; border:1px solid #fee2e2; background:#fff5f5; color:var(--high); font-size:0.95rem }

        .modal-actions { display:flex; justify-content:flex-end; gap:0.7rem; margin-top:1rem }
        .btn-secondary, .btn-primary { border:none; padding:0.7rem 1rem; border-radius:10px; cursor:pointer; font-weight:700 }
        .btn-secondary { background:#f1f5f9; color:var(--text) }
        .btn-primary { background: linear-gradient(90deg,var(--accent),#3b82f6); color:white }

        /* Comments (inside the task dialog) */
        .comments-section { margin-top: 1.1rem; padding-top: 1rem; border-top: 1px solid var(--border) }
        .comments-section h3 { margin: 0 0 0.6rem; font-size: 1rem }

        .comments-list { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 0.75rem; max-height: 220px; overflow-y: auto; scrollbar-width: thin }
        .comments-list[hidden] { display: none }

        .comment { background: var(--muted-surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 0.75rem }
        .comment-text { margin: 0 0 0.4rem; font-weight: 400; font-size: 0.92rem; white-space: pre-wrap; word-break: break-word }
        .comment-meta { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; font-size: 0.78rem; color: var(--muted); font-weight: 400 }

        .comment-actions { display: flex; gap: 0.2rem }
        .comment-actions button { border: none; background: transparent; cursor: pointer; font-weight: 600; font-size: 0.78rem; padding: 0.15rem 0.4rem; border-radius: 6px }
        .btn-comment-edit { color: var(--accent) }
        .btn-comment-delete { color: var(--high) }
        .btn-comment-edit:hover, .btn-comment-delete:hover { background: #f1f5f9 }

        .comment-edit-input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.6rem; font-family: inherit; font-size: 0.9rem; min-height: 56px; resize: vertical; margin-bottom: 0.4rem }

        .comments-empty { margin: 0; padding: 0.7rem; border: 1px dashed var(--border); border-radius: 10px; color: var(--muted); text-align: center; font-size: 0.88rem; font-weight: 400 }

        .comment-form { display: flex; flex-direction: column; gap: 0.4rem }
        /* Same look as the other dialog inputs (.field only styles its own children). */
        .comment-form textarea { min-height: 60px; resize: vertical; border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 0.9rem; font-size: 0.95rem; font-family: inherit; color: var(--text) }
        .comment-form textarea:focus { outline: none; box-shadow: 0 6px 20px rgba(99,102,241,0.12); border-color: rgba(99,102,241,0.18) }
        .comment-edit-input:focus { outline: none; box-shadow: 0 6px 20px rgba(99,102,241,0.12); border-color: rgba(99,102,241,0.18) }
        .comment-form-footer { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem }
        .comment-counter { font-size: 0.78rem; color: var(--muted); font-weight: 400 }
        .comment-counter.over { color: var(--high) }
        .comment-hint { margin: 0; font-size: 0.8rem; color: var(--muted); font-weight: 400 }

        .btn-add-comment { border: none; background: var(--accent-soft); color: var(--accent); padding: 0.5rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 700 }
        .btn-add-comment:hover { background: #e0e7ff }

        .comment-alert { margin-bottom: 0.6rem; padding: 0.5rem 0.7rem; border-radius: 8px; border: 1px solid #fee2e2; background: #fff5f5; color: var(--high); font-size: 0.85rem; font-weight: 400 }

        /* Filter bar */
        .filters {
            display: grid;
            grid-template-columns: minmax(220px, 2fr) repeat(2, minmax(140px, 1fr)) minmax(160px, 1fr) auto;
            gap: 0.75rem;
            align-items: end;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: linear-gradient(180deg, var(--surface), var(--muted-surface));
            box-shadow: 0 6px 22px rgba(15, 23, 42, 0.04);
        }

        .filters .field {
            margin-bottom: 0;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .filters input,
        .filters select {
            padding: 0.6rem 0.75rem;
            font-size: 0.92rem;
            color: var(--text);
            background: white;
        }

        .btn-clear-filters {
            border: 1px solid var(--border);
            background: white;
            color: var(--muted);
            padding: 0.65rem 0.9rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-clear-filters:hover { background: #f1f5f9; color: var(--text) }
        .btn-clear-filters:disabled { opacity: 0.5; cursor: default }

        @media (max-width:900px) {
            /* Stacked columns don't fit a locked viewport: back to page scrolling. */
            body { display: block; overflow: auto }
            main { display: block; padding:1rem }
            .board-shell { display: block }
            .board { grid-template-columns: 1fr }
            .column { overflow: visible }
            .column-body { overflow-y: visible; max-height: none }
            .app-header { border-radius:10px; margin:1rem; width:auto }
            .filters { grid-template-columns: 1fr }
        }
    </style>
</head>
<body>
    <!-- SVG icons used in the UI -->
    <svg aria-hidden="true" style="display:none">
        <symbol id="icon-edit" viewBox="0 0 24 24">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1.003 1.003 0 0 0 0-1.42l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"></path>
        </symbol>
        <symbol id="icon-empty" viewBox="0 0 24 24">
            <path d="M19 3h-4.18A3 3 0 0 0 9.18 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm1 13h-2v-2H9v-2h2v-2h2v2h2v2h-2v2z"></path>
        </symbol>
    </svg>
    <header class="app-header">
        <div class="header-content">
            <div>
                <h1>Task Tracker</h1>
                <p>Keep work moving with a simple Kanban view.</p>
            </div>
            <button class="btn-create" id="new-task-button" type="button" data-action="new-task">New Task</button>
        </div>
    </header>

    <main>
        <form id="filters" class="filters" aria-label="Search and filter tasks" autocomplete="off">
            <label class="field" for="filter-search">
                Search
                <input id="filter-search" name="search" type="search" placeholder="Title or description…">
            </label>

            <label class="field" for="filter-status">
                Status
                <select id="filter-status" name="status">
                    <option value="">All statuses</option>
                    <option value="ToDo">To Do</option>
                    <option value="InProgress">In Progress</option>
                    <option value="Done">Done</option>
                </select>
            </label>

            <label class="field" for="filter-priority">
                Priority
                <select id="filter-priority" name="priority">
                    <option value="">All priorities</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </label>

            <label class="field" for="filter-assignee">
                Assignee
                <input id="filter-assignee" name="assignee" type="text" placeholder="Any assignee">
            </label>

            <button class="btn-clear-filters" id="clear-filters" type="button" disabled>Clear</button>
        </form>

        <div class="board-shell">
            <div id="board-notice" class="board-notice-slot" role="alert" aria-live="assertive"></div>
            <section id="board" class="board" aria-label="Task board"></section>
            <div id="error-overlay" class="error-overlay" aria-live="assertive" aria-hidden="true"></div>
        </div>
    </main>

    <div id="task-modal" class="modal-backdrop" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <h2 id="modal-title">New Task</h2>
                <button class="modal-close" id="modal-close" type="button" aria-label="Close">×</button>
            </div>
            <form id="task-form" class="task-form">
                <div id="form-alert" class="form-alert" role="alert" hidden></div>
                <input type="hidden" id="task-id" name="taskId">

                <label class="field" for="task-title">
                    Title
                    <input id="task-title" name="title" type="text" required>
                </label>

                <label class="field" for="task-description">
                    Description
                    <textarea id="task-description" name="description"></textarea>
                </label>

                <label class="field" for="task-status">
                    Status
                    <select id="task-status" name="status">
                        <option value="ToDo">To Do</option>
                        <option value="InProgress">In Progress</option>
                        <option value="Done">Done</option>
                    </select>
                </label>

                <label class="field" for="task-priority">
                    Priority
                    <select id="task-priority" name="priority">
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </label>

                <label class="field" for="task-assignee">
                    Assignee
                    <input id="task-assignee" name="assignee" type="text">
                </label>

                <section class="comments-section" aria-label="Comments">
                    <h3>Comments</h3>
                    <div id="comments-list" class="comments-list"></div>
                    <div id="comment-alert" class="comment-alert" role="alert" hidden></div>
                    <div class="comment-form">
                        <textarea id="comment-text" placeholder="Write a comment…" maxlength="1000"></textarea>
                        <div class="comment-form-footer">
                            <span id="comment-counter" class="comment-counter">0 / 1000</span>
                            <p id="comment-hint" class="comment-hint" hidden>Your comment will be added when the task is saved.</p>
                            <button class="btn-add-comment" id="add-comment-button" type="button">Add Comment</button>
                        </div>
                    </div>
                </section>

                <div class="modal-actions">
                    <button class="btn-secondary" id="cancel-button" type="button" data-action="cancel">Cancel</button>
                    <button class="btn-primary" type="submit">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const statusOrder = ['ToDo', 'InProgress', 'Done'];
        const statusLabels = {
            ToDo: 'To Do',
            InProgress: 'In Progress',
            Done: 'Done'
        };
        const priorityOrder = {
            High: 0,
            Medium: 1,
            Low: 2
        };

        const board = document.getElementById('board');
        const boardShell = document.querySelector('.board-shell');
        const errorOverlay = document.getElementById('error-overlay');
        const noticeSlot = document.getElementById('board-notice');
        const newTaskButton = document.getElementById('new-task-button');
        const taskModal = document.getElementById('task-modal');
        const modalCloseButton = document.getElementById('modal-close');
        const cancelButton = document.getElementById('cancel-button');
        const modalTitle = document.getElementById('modal-title');
        const taskForm = document.getElementById('task-form');
        const taskIdInput = document.getElementById('task-id');
        const titleInput = document.getElementById('task-title');
        const descriptionInput = document.getElementById('task-description');
        const statusInput = document.getElementById('task-status');
        const priorityInput = document.getElementById('task-priority');
        const assigneeInput = document.getElementById('task-assignee');
        const formAlert = document.getElementById('form-alert');
        const filtersForm = document.getElementById('filters');
        const searchFilter = document.getElementById('filter-search');
        const statusFilter = document.getElementById('filter-status');
        const priorityFilter = document.getElementById('filter-priority');
        const assigneeFilter = document.getElementById('filter-assignee');
        const clearFiltersButton = document.getElementById('clear-filters');
        const commentsList = document.getElementById('comments-list');
        const commentAlert = document.getElementById('comment-alert');
        const commentInput = document.getElementById('comment-text');
        const commentCounter = document.getElementById('comment-counter');
        const commentHint = document.getElementById('comment-hint');
        const addCommentButton = document.getElementById('add-comment-button');
        const COMMENT_MAX_LENGTH = 1000;
        let tasks = [];
        let filterDebounceTimer = null;
        let boardNotice = '';
        let boardNoticeTimer = null;
        let draggedTaskId = null;
        let currentComments = [];
        let editingCommentId = null;

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function sortTasks(taskList) {
            return [...taskList].sort((a, b) => {
                const priorityDelta = priorityOrder[a.priority] - priorityOrder[b.priority];
                if (priorityDelta !== 0) {
                    return priorityDelta;
                }

                return Number(a.id) - Number(b.id);
            });
        }

        function getInitials(name) {
            if (!name) return '';
            const parts = String(name).trim().split(/\s+/);
            if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
            return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
        }

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (Number.isNaN(d.getTime())) return String(iso);
            return d.toLocaleString();
        }

        function hideErrorOverlay() {
            errorOverlay.classList.remove('is-visible');
            errorOverlay.setAttribute('aria-hidden', 'true');
        }

        function showBoardNotice(message) {
            boardNotice = message;
            window.clearTimeout(boardNoticeTimer);
            boardNoticeTimer = window.setTimeout(() => {
                boardNotice = '';
                renderBoard(tasks, tasks.length === 0 ? 'empty' : 'ready');
            }, 5000);
            renderBoard(tasks, tasks.length === 0 ? 'empty' : 'ready');
        }

        function renderNotice(notice) {
            noticeSlot.innerHTML = notice
                ? `<div class="board-notice">${escapeHtml(notice)}</div>`
                : '';
        }

        function renderEmptyState() {
            if (hasActiveFilters()) {
                return `
                    <div class="board-empty">
                        <span class="empty-icon"><svg aria-hidden="true"><use href="#icon-empty"></use></svg></span>
                        <h2>No matching tasks</h2>
                        <p>No tasks match the current search and filters.</p>
                        <button class="btn-create" type="button" data-action="clear-filters">Clear filters</button>
                    </div>
                `;
            }

            return `
                <div class="board-empty">
                    <span class="empty-icon"><svg aria-hidden="true"><use href="#icon-empty"></use></svg></span>
                    <h2>No tasks yet</h2>
                    <p>Create your first task to start filling the board.</p>
                    <button class="btn-create" type="button" data-action="new-task">New Task</button>
                </div>
            `;
        }

        function renderLoadingState() {
            hideErrorOverlay();
            renderNotice('');
            board.innerHTML = `
                <div class="state state-loading" role="status" aria-live="polite">
                    <h2 class="state-title">Loading tasks…</h2>
                    <p class="state-message">The board is fetching your tasks.</p>
                </div>
            `;
        }

        function renderErrorState() {
            errorOverlay.innerHTML = `
                <div class="state state-error" role="alert">
                    <h2 class="state-title">Unable to load tasks</h2>
                    <p class="state-message">Please try again in a moment.</p>
                    <div class="state-actions">
                        <button class="btn-retry" type="button" data-action="retry">Retry</button>
                    </div>
                </div>
            `;
            errorOverlay.classList.add('is-visible');
            errorOverlay.setAttribute('aria-hidden', 'false');
        }

        function renderBoard(taskList, state = 'ready', notice = boardNotice) {
            if (state === 'loading') {
                renderLoadingState();
                return;
            }

            if (state === 'error') {
                renderNotice(notice);
                // No empty state here: the tasks failed to load, they aren't absent.
                const emptyMarkup = '';

                const columnsMarkup = statusOrder.map((status, colIndex) => {
                    const tasksForStatus = sortTasks(taskList.filter((task) => task.status === status));
                    const columnBodyMarkup = tasksForStatus.length > 0
                        ? tasksForStatus.map((task, i) => `
                            <article class="card animate-in" style="animation-delay:${i*70}ms" draggable="true" data-task-id="${escapeHtml(task.id)}">
                                <div class="card-meta">
                                    <div style="display:flex;align-items:center">
                                        <span class="avatar">${escapeHtml(getInitials(task.assignee))}</span>
                                        <strong>${escapeHtml(task.title)}</strong>
                                    </div>
                                    <span class="priority priority-${escapeHtml(task.priority.toLowerCase())}">${escapeHtml(task.priority)}</span>
                                </div>
                                ${task.description ? `<p class="card-description">${escapeHtml(task.description)}</p>` : ''}
                                <div class="card-meta">
                                    <span>${escapeHtml(task.assignee || 'Unassigned')}</span>
                                    <span>${escapeHtml(formatDate(task.updated_at || task.created_at || ''))}</span>
                                </div>
                                <button class="btn-edit" type="button" aria-label="Edit">
                                    <svg class="icon" aria-hidden="true"><use href="#icon-edit"></use></svg>
                                    <span class="sr-only">Edit</span>
                                </button>
                            </article>
                        `).join('')
                        : '<p class="column-placeholder">No tasks in this column yet.</p>';

                    return `
                        <section class="column animate-in" style="animation-delay:${colIndex*80}ms" data-status="${escapeHtml(status)}">
                            <div class="column-header">
                                <h2>${escapeHtml(statusLabels[status])}</h2>
                                <span class="count">${tasksForStatus.length}</span>
                            </div>
                            <div class="column-body">
                                ${columnBodyMarkup}
                            </div>
                        </section>
                    `;
                }).join('');

                board.innerHTML = `${emptyMarkup}${columnsMarkup}`;
                renderErrorState();
                return;
            }

            hideErrorOverlay();
            renderNotice(notice);

            const emptyMarkup = taskList.length === 0 ? renderEmptyState() : '';

            const columnsMarkup = statusOrder.map((status) => {
                const tasksForStatus = sortTasks(taskList.filter((task) => task.status === status));
                const columnBodyMarkup = tasksForStatus.length > 0
                    ? tasksForStatus.map((task) => `
                        <article class="card" draggable="true" data-task-id="${escapeHtml(task.id)}">
                            <div class="card-meta">
                                <strong>${escapeHtml(task.title)}</strong>
                                <span class="priority priority-${escapeHtml(task.priority.toLowerCase())}">${escapeHtml(task.priority)}</span>
                            </div>
                            ${task.description ? `<p class="card-description">${escapeHtml(task.description)}</p>` : ''}
                            <div class="card-meta">
                                <span>Assignee</span>
                                <span>${escapeHtml(task.assignee || 'Unassigned')}</span>
                            </div>
                            <button class="btn-edit" type="button" aria-label="Edit">
                                <svg class="icon" aria-hidden="true"><use href="#icon-edit"></use></svg>
                                <span class="sr-only">Edit</span>
                            </button>
                        </article>
                    `).join('')
                    : '<p class="column-placeholder">No tasks in this column yet.</p>';

                return `
                    <section class="column" data-status="${escapeHtml(status)}">
                        <div class="column-header">
                            <h2>${escapeHtml(statusLabels[status])}</h2>
                            <span class="count">${tasksForStatus.length}</span>
                        </div>
                        <div class="column-body">
                            ${columnBodyMarkup}
                        </div>
                    </section>
                `;
            }).join('');

            board.innerHTML = `${emptyMarkup}${columnsMarkup}`;
        }

        function resetTaskForm() {
            taskForm.reset();
            taskIdInput.value = '';
            setFormError('');
            currentComments = [];
            editingCommentId = null;
            setCommentError('');
            updateCommentCounter();
        }

        function setFormError(message) {
            formAlert.textContent = message;
            formAlert.hidden = !message;
        }

        function openTaskModal(mode = 'create', task = null) {
            resetTaskForm();
            modalTitle.textContent = mode === 'edit' ? 'Edit Task' : 'New Task';
            taskForm.dataset.mode = mode;

            if (mode === 'edit' && task) {
                taskIdInput.value = task.id;
                titleInput.value = task.title || '';
                descriptionInput.value = task.description || '';
                statusInput.value = task.status || 'ToDo';
                priorityInput.value = task.priority || 'Medium';
                assigneeInput.value = task.assignee || '';
                /* Existing task: show the list and post comments immediately. */
                commentsList.hidden = false;
                addCommentButton.hidden = false;
                commentHint.hidden = true;
                fetchComments(task.id);
            } else {
                statusInput.value = 'ToDo';
                priorityInput.value = 'Medium';
                /* New task: no comments exist yet; the typed comment is posted after save. */
                commentsList.hidden = true;
                addCommentButton.hidden = true;
                commentHint.hidden = false;
            }

            taskModal.classList.add('is-open');
            taskModal.setAttribute('aria-hidden', 'false');
            document.body.classList.add('modal-open');
            titleInput.focus();
        }

        function closeTaskModal() {
            taskModal.classList.remove('is-open');
            taskModal.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('modal-open');
            resetTaskForm();
        }

        /* --- Comments --- */

        function commentsUrl(taskId, commentId = '') {
            return `http://localhost:8000/tasks/${taskId}/comments${commentId ? `/${commentId}` : ''}`;
        }

        function setCommentError(message) {
            commentAlert.textContent = message;
            commentAlert.hidden = !message;
        }

        /* Mirrors the backend rules: non-blank after trimming, max 1000 characters. */
        function validateCommentText(raw) {
            const text = String(raw).trim();
            if (!text) {
                return { error: 'Comment must not be blank.' };
            }
            if (text.length > COMMENT_MAX_LENGTH) {
                return { error: `Comment must be ${COMMENT_MAX_LENGTH} characters or fewer.` };
            }
            return { text };
        }

        function updateCommentCounter() {
            const length = commentInput.value.trim().length;
            commentCounter.textContent = `${length} / ${COMMENT_MAX_LENGTH}`;
            commentCounter.classList.toggle('over', length > COMMENT_MAX_LENGTH);
        }

        function renderComments() {
            if (currentComments.length === 0) {
                commentsList.innerHTML = '<p class="comments-empty">No comments yet. Start the discussion below.</p>';
                return;
            }

            commentsList.innerHTML = currentComments.map((comment) => {
                if (comment.id === editingCommentId) {
                    return `
                        <div class="comment" data-comment-id="${escapeHtml(comment.id)}">
                            <textarea class="comment-edit-input" maxlength="1000">${escapeHtml(comment.text)}</textarea>
                            <div class="comment-meta">
                                <span></span>
                                <span class="comment-actions">
                                    <button class="btn-comment-edit" type="button" data-action="save-comment">Save</button>
                                    <button class="btn-comment-delete" type="button" data-action="cancel-comment-edit">Cancel</button>
                                </span>
                            </div>
                        </div>
                    `;
                }

                /* An edited comment shows its last edit time instead of the creation time. */
                const dateLabel = comment.edited_at
                    ? `Edited ${formatDate(comment.edited_at)}`
                    : formatDate(comment.created_at);

                return `
                    <div class="comment" data-comment-id="${escapeHtml(comment.id)}">
                        <p class="comment-text">${escapeHtml(comment.text)}</p>
                        <div class="comment-meta">
                            <span>${escapeHtml(dateLabel)}</span>
                            <span class="comment-actions">
                                <button class="btn-comment-edit" type="button" data-action="edit-comment">Edit</button>
                                <button class="btn-comment-delete" type="button" data-action="delete-comment">Delete</button>
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function fetchComments(taskId) {
            commentsList.innerHTML = '<p class="comments-empty">Loading comments…</p>';
            try {
                const response = await fetch(commentsUrl(taskId));
                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }

                currentComments = await response.json();
                renderComments();
            } catch (error) {
                console.error('Failed to load comments', error);
                commentsList.innerHTML = '<p class="comments-empty">Unable to load comments.</p>';
            }
        }

        async function addComment() {
            const { text, error } = validateCommentText(commentInput.value);
            if (error) {
                setCommentError(error);
                commentInput.focus();
                return;
            }

            try {
                const response = await fetch(commentsUrl(taskIdInput.value), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) {
                    setCommentError(await getErrorMessage(response));
                    return;
                }

                commentInput.value = '';
                updateCommentCounter();
                setCommentError('');
                await fetchComments(taskIdInput.value);
            } catch (error) {
                setCommentError(error.message || 'Unable to add comment. Please try again.');
            }
        }

        async function saveCommentEdit(commentId, raw) {
            const { text, error } = validateCommentText(raw);
            if (error) {
                setCommentError(error);
                return;
            }

            try {
                const response = await fetch(commentsUrl(taskIdInput.value, commentId), {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) {
                    setCommentError(await getErrorMessage(response));
                    return;
                }

                editingCommentId = null;
                setCommentError('');
                await fetchComments(taskIdInput.value);
            } catch (error) {
                setCommentError(error.message || 'Unable to save comment. Please try again.');
            }
        }

        async function deleteComment(commentId) {
            try {
                const response = await fetch(commentsUrl(taskIdInput.value, commentId), { method: 'DELETE' });
                if (!response.ok) {
                    setCommentError(await getErrorMessage(response));
                    return;
                }

                setCommentError('');
                await fetchComments(taskIdInput.value);
            } catch (error) {
                setCommentError(error.message || 'Unable to delete comment. Please try again.');
            }
        }

        commentsList.addEventListener('click', (event) => {
            const item = event.target.closest('[data-comment-id]');
            if (!item) {
                return;
            }

            const commentId = item.dataset.commentId;

            if (event.target.matches('[data-action="edit-comment"]')) {
                editingCommentId = commentId;
                setCommentError('');
                renderComments();
                commentsList.querySelector('.comment-edit-input')?.focus();
                return;
            }

            if (event.target.matches('[data-action="cancel-comment-edit"]')) {
                editingCommentId = null;
                setCommentError('');
                renderComments();
                return;
            }

            if (event.target.matches('[data-action="save-comment"]')) {
                const editInput = item.querySelector('.comment-edit-input');
                saveCommentEdit(commentId, editInput ? editInput.value : '');
                return;
            }

            if (event.target.matches('[data-action="delete-comment"]')) {
                deleteComment(commentId);
            }
        });

        addCommentButton.addEventListener('click', addComment);
        commentInput.addEventListener('input', () => {
            updateCommentCounter();
            if (!commentAlert.hidden) {
                setCommentError('');
            }
        });

        /* Reads the filter bar. Blank inputs are omitted so the API returns everything. */
        function readFilters() {
            return {
                search: searchFilter.value.trim(),
                status: statusFilter.value,
                priority: priorityFilter.value,
                assignee: assigneeFilter.value.trim()
            };
        }

        function hasActiveFilters() {
            return Object.values(readFilters()).some((value) => value !== '');
        }

        function buildTasksUrl() {
            const url = new URL('http://localhost:8000/tasks');
            Object.entries(readFilters()).forEach(([key, value]) => {
                if (value) {
                    url.searchParams.set(key, value);
                }
            });

            return url;
        }

        /* Text inputs debounce so typing doesn't fire a request per keystroke. */
        function applyFilters({ debounce = false } = {}) {
            window.clearTimeout(filterDebounceTimer);
            clearFiltersButton.disabled = !hasActiveFilters();

            if (!debounce) {
                fetchTasks();
                return;
            }

            filterDebounceTimer = window.setTimeout(fetchTasks, 250);
        }

        async function fetchTasks() {
            boardNotice = '';
            renderBoard([], 'loading');

            try {
                const response = await fetch(buildTasksUrl());
                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }

                tasks = await response.json();
                renderBoard(tasks, tasks.length === 0 ? 'empty' : 'ready');
            } catch (error) {
                console.error('Failed to load tasks', error);
                renderBoard([], 'error');
            }
        }

        function clearDragState() {
            draggedTaskId = null;
            board.querySelectorAll('.column').forEach((column) => column.classList.remove('drag-over'));
            board.querySelectorAll('.card.dragging').forEach((card) => card.classList.remove('dragging'));
        }

        function getErrorMessage(response) {
            return response.json().then((payload) => {
                if (payload && payload.detail) {
                    if (Array.isArray(payload.detail)) {
                        return payload.detail.map((item) => item.msg || item).join(' ');
                    }

                    return String(payload.detail);
                }

                return `Request failed with status ${response.status}`;
            }).catch(() => `Request failed with status ${response.status}`);
        }

        async function submitTaskForm(event) {
            event.preventDefault();

            const title = titleInput.value.trim();
            if (!title) {
                setFormError('Title is required');
                titleInput.focus();
                return;
            }

            const payload = {
                title,
                description: descriptionInput.value,
                status: statusInput.value,
                priority: priorityInput.value,
                assignee: assigneeInput.value.trim() ? assigneeInput.value.trim() : null
            };

            const isEdit = Boolean(taskIdInput.value);
            const endpoint = isEdit
                ? `http://localhost:8000/tasks/${taskIdInput.value}`
                : 'http://localhost:8000/tasks';
            const method = isEdit ? 'PATCH' : 'POST';

            /* New task: a typed comment is validated up front and posted after the task exists. */
            const pendingComment = !isEdit ? commentInput.value.trim() : '';
            if (pendingComment) {
                const { error } = validateCommentText(pendingComment);
                if (error) {
                    setCommentError(error);
                    commentInput.focus();
                    return;
                }
            }

            try {
                const response = await fetch(endpoint, {
                    method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const message = await getErrorMessage(response);
                    setFormError(message);
                    return;
                }

                let commentFailure = '';
                if (pendingComment) {
                    const createdTask = await response.json();
                    const commentResponse = await fetch(commentsUrl(createdTask.id), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: pendingComment })
                    });

                    if (!commentResponse.ok) {
                        commentFailure = await getErrorMessage(commentResponse);
                    }
                }

                closeTaskModal();
                await fetchTasks();
                if (commentFailure) {
                    showBoardNotice(`Task created, but the comment was not added: ${commentFailure}`);
                }
            } catch (error) {
                setFormError(error.message || 'Unable to save task. Please try again.');
            }
        }

        async function handleDrop(event) {
            const column = event.target.closest('.column');
            if (!column || !draggedTaskId) {
                clearDragState();
                return;
            }

            event.preventDefault();

            const targetStatus = column.dataset.status;
            const previousTask = tasks.find((task) => task.id === draggedTaskId);
            if (!previousTask || previousTask.status === targetStatus) {
                clearDragState();
                return;
            }

            const optimisticTask = { ...previousTask, status: targetStatus };
            tasks = tasks.map((task) => (task.id === draggedTaskId ? optimisticTask : task));
            boardNotice = '';
            renderBoard(tasks, tasks.length === 0 ? 'empty' : 'ready');

            try {
                const response = await fetch(`http://localhost:8000/tasks/${draggedTaskId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: targetStatus })
                });

                if (!response.ok) {
                    const message = await getErrorMessage(response);
                    throw new Error(message);
                }

                const updatedTask = await response.json();
                tasks = tasks.map((task) => (task.id === draggedTaskId ? updatedTask : task));
                renderBoard(tasks, tasks.length === 0 ? 'empty' : 'ready');
            } catch (error) {
                tasks = tasks.map((task) => (task.id === draggedTaskId ? previousTask : task));
                showBoardNotice(error.message || 'Unable to update task. Please check your connection and try again.');
            } finally {
                clearDragState();
            }
        }

        boardShell.addEventListener('click', (event) => {
            if (event.target.matches('[data-action="retry"]')) {
                fetchTasks();
                return;
            }

            if (event.target.closest('[data-action="new-task"]')) {
                openTaskModal('create');
                return;
            }

            if (event.target.closest('[data-action="clear-filters"]')) {
                clearFilters();
                return;
            }

            const editButton = event.target.closest('.btn-edit');
            if (!editButton) {
                return;
            }

            const card = editButton.closest('.card');
            const taskId = card?.dataset.taskId;
            const task = tasks.find((item) => String(item.id) === String(taskId));
            if (task) {
                openTaskModal('edit', task);
            }
        });

        function clearFilters() {
            filtersForm.reset();
            applyFilters();
        }

        filtersForm.addEventListener('input', (event) => {
            applyFilters({ debounce: event.target.type !== 'select-one' });
        });
        filtersForm.addEventListener('submit', (event) => {
            event.preventDefault();
            applyFilters();
        });
        clearFiltersButton.addEventListener('click', clearFilters);

        newTaskButton.addEventListener('click', () => openTaskModal('create'));
        modalCloseButton.addEventListener('click', closeTaskModal);
        cancelButton.addEventListener('click', closeTaskModal);
        taskForm.addEventListener('submit', submitTaskForm);
        taskForm.addEventListener('input', () => {
            if (!formAlert.hidden) {
                setFormError('');
            }
        });
        taskModal.addEventListener('click', (event) => {
            if (event.target === taskModal) {
                closeTaskModal();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && taskModal.classList.contains('is-open')) {
                closeTaskModal();
            }
        });

        board.addEventListener('dragstart', (event) => {
            const card = event.target.closest('.card');
            if (!card) {
                return;
            }

            draggedTaskId = card.dataset.taskId;
            card.classList.add('dragging');
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', draggedTaskId);
        });

        board.addEventListener('dragend', (event) => {
            if (event.target.closest('.card')) {
                clearDragState();
            }
        });

        board.addEventListener('dragover', (event) => {
            const column = event.target.closest('.column');
            const currentTask = tasks.find((task) => task.id === draggedTaskId);

            if (!column || !currentTask || currentTask.status === column.dataset.status) {
                return;
            }

            event.preventDefault();
            column.classList.add('drag-over');
            event.dataTransfer.dropEffect = 'move';
        });

        board.addEventListener('dragleave', (event) => {
            const column = event.target.closest('.column');
            if (!column) {
                return;
            }

            if (!event.relatedTarget || !column.contains(event.relatedTarget)) {
                column.classList.remove('drag-over');
            }
        });

        board.addEventListener('drop', handleDrop);

        fetchTasks();
    </script>
</body>
</html>
